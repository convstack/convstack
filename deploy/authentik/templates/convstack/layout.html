<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #fafbfc;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #fafbfc; font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #111827;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px;">
            <tr>
              <td style="padding: 32px 24px; background-color: #ffffff; border: 1px solid #e4e8ef; border-radius: 12px;">
                <h1 style="margin: 0 0 16px; font-size: 20px; line-height: 1.25; font-weight: 600;">{% block heading %}{% endblock %}</h1>
                <p style="margin: 0 0 24px;">{% block message %}{% endblock %}</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="border-radius: 8px; background-color: #3a63e0;">
                      <a href="{{ url }}" rel="noopener noreferrer" target="_blank" style="display: inline-block; padding: 12px 20px; font-weight: 600; color: #ffffff; text-decoration: none;">{% block action %}{% endblock %}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; font-size: 14px; color: #4b5563;">The link works once and for {{ expires|timeuntil }}. If the button does not work, copy this address into your browser:</p>
                <p style="margin: 8px 0 0; font-size: 14px; word-break: break-all;"><a href="{{ url }}" rel="noopener noreferrer" target="_blank" style="color: #3a63e0;">{{ url }}</a></p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 4px 0; font-size: 14px; color: #4b5563;">{% block ignore %}{% endblock %}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
