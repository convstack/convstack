  - model: authentik_policies_expression.expressionpolicy
    id: convstack-recovery-skip-if-restored
    identifiers:
      name: convstack-recovery-skip-if-restored
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))

  - model: authentik_flows.flow
    id: convstack-recovery-flow
    identifiers:
      slug: convstack-recovery
    permissions:
      - permission: authentik_flows.view_flow
        role: !KeyOf lanyard-service-role
      - permission: authentik_flows.change_flow
        role: !KeyOf lanyard-service-role
    attrs:
      name: ConvStack password reset
      title: Reset your password
      layout: sidebar_left
