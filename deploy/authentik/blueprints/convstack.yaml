      authentication: require_unauthenticated

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      order: 0
    attrs:
      policy: !KeyOf convstack-mail-configured
      enabled: true

  - model: authentik_flows.flowstagebinding
    id: convstack-recovery-binding-identification
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-recovery-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-recovery-email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-set-password
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-write-password
      order: 40

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-self-service-login
      order: 100

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-recovery-skip-if-restored
      target: !KeyOf convstack-recovery-binding-identification
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  # always part of both flows; this policy, written from .env on every apply,
  # decides whether the step runs
  - model: authentik_policies_expression.expressionpolicy
    id: convstack-captcha-configured
    identifiers:
      name: convstack-captcha-configured
    attrs:
      expression: !If [!Condition [AND, !Env TURNSTILE_SITE_KEY, !Env TURNSTILE_SECRET_KEY], "return True", "return False"]

  - model: authentik_stages_captcha.captchastage
    id: convstack-captcha
    identifiers:
      name: convstack-captcha
    attrs:
      # "unset" only keeps Authentik's required key fields non-blank
      public_key: !Env [TURNSTILE_SITE_KEY, unset]
      private_key: !Env [TURNSTILE_SECRET_KEY, unset]
      js_url: https://challenges.cloudflare.com/turnstile/v0/api.js
      api_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
      interactive: true

  - model: authentik_flows.flowstagebinding
    id: convstack-enrollment-binding-captcha
    identifiers:
      target: !KeyOf convstack-enrollment-flow
      stage: !KeyOf convstack-captcha
      order: 5

  - model: authentik_flows.flowstagebinding
    id: convstack-recovery-binding-captcha
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-captcha
      order: 5

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-captcha-configured
      target: !KeyOf convstack-enrollment-binding-captcha
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-captcha-configured
      target: !KeyOf convstack-recovery-binding-captcha
      order: 0
    attrs:
      enabled: true

  # Authentik tests a link's time and single use when its Continue page loads,
  # not when Continue is pressed, so a page left open, or a second browser that
  # loaded it in time, would still get through. The first browser to continue
  # claims the link
  - model: authentik_policies_expression.expressionpolicy
    id: convstack-link-spent
    identifiers:
      name: convstack-link-spent
    attrs:
      expression: |
        from django.core.cache import cache
        from django.utils.timezone import now

        link = request.context["is_restored"]
        if link.expires < now():
            return True
        browser = request.http_request.session.session_key
        # not link.pk, which is gone once the Continue page deleted the link
        claim = f"convstack-link-{link.identifier}"
        if cache.get(claim) is None:
            # add() never replaces a claim that is already there
            cache.add(claim, browser, 3600)
        return cache.get(claim) != browser

  - model: authentik_stages_deny.denystage
    id: convstack-link-refused
    identifiers:
      name: convstack-link-refused
    attrs:
      deny_message: This link has expired or was already used. Request a new one.

  - model: authentik_flows.flowstagebinding
    id: convstack-enrollment-binding-link
    identifiers:
      target: !KeyOf convstack-enrollment-flow
      stage: !KeyOf convstack-link-refused
      order: 33

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-link-spent
      target: !KeyOf convstack-enrollment-binding-link
      order: 0
    attrs:
      enabled: true
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: convstack-recovery-binding-link
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-link-refused
      order: 23

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-link-spent
      target: !KeyOf convstack-recovery-binding-link
      order: 0
    attrs:
      enabled: true
      failure_result: true

  # runs once a mailed link was followed, and again before a password is
  # saved. A flow keeps the account as it was when the mail went out and saves
  # that copy back, and a link opened in a browser that already filled in a
  # sign-up form takes over that form's answers. So this reads the account
  # again and leaves nothing to save but the password
  - model: authentik_policies_expression.expressionpolicy
    id: convstack-account-deactivated
    identifiers:
      name: convstack-account-deactivated
    attrs:
      expression: |
        from authentik.core.models import User

        current = User.objects.filter(pk=request.user.pk).first()
        if current is None:
            return True
        if current.attributes.pop("convstack_pending", None):
            if not current.is_active and current.last_login is None:
                # the link confirmed the address. From here on this is a real
                # account, and being inactive means an admin deactivated it
                current.is_active = True
            current.save(update_fields=["attributes", "is_active"])
        request.context["flow_plan"].context["pending_user"] = current
        answers = request.context.get("prompt_data", {})
        for key in list(answers):
            if key not in ("password", "password_repeat"):
                del answers[key]
        return not current.is_active

  - model: authentik_stages_deny.denystage
    id: convstack-deactivated
    identifiers:
      name: convstack-deactivated
    attrs:
      deny_message: This account is deactivated.

  - model: authentik_flows.flowstagebinding
    id: convstack-enrollment-binding-confirmed
    identifiers:
      target: !KeyOf convstack-enrollment-flow
      stage: !KeyOf convstack-deactivated
      order: 35

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-account-deactivated
      target: !KeyOf convstack-enrollment-binding-confirmed
      order: 0
    attrs:
      enabled: true
      # if the check itself breaks, end the flow
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: convstack-enrollment-binding-before-write
    identifiers:
      target: !KeyOf convstack-enrollment-flow
      stage: !KeyOf convstack-deactivated
      order: 45

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-account-deactivated
      target: !KeyOf convstack-enrollment-binding-before-write
      order: 0
    attrs:
      enabled: true
      failure_result: true

  - model: authentik_flows.flowstagebinding
    id: convstack-recovery-binding-confirmed
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-deactivated
      order: 25

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-account-deactivated
      target: !KeyOf convstack-recovery-binding-confirmed
      order: 0
    attrs:
      enabled: true
      failure_result: true

  # a mailed link stands in for the password, not for the second factor
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 27

  - model: authentik_flows.flowstagebinding
    id: convstack-recovery-binding-before-write
    identifiers:
      target: !KeyOf convstack-recovery-flow
      stage: !KeyOf convstack-deactivated
      order: 35

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf convstack-account-deactivated
      target: !KeyOf convstack-recovery-binding-before-write
      order: 0
    attrs:
      enabled: true
      failure_result: true

  # the links follow the mail host like the flows do. A second entry for the
  # stage, because the flows above have to exist before it can point at them
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      # Authentik's check of this stage wants its login fields in every entry
      user_fields:
        - email
        - username
      enrollment_flow: !If [!Env AUTHENTIK_EMAIL__HOST, !KeyOf convstack-enrollment-flow, null]
      recovery_flow: !If [!Env AUTHENTIK_EMAIL__HOST, !KeyOf convstack-recovery-flow, null]
