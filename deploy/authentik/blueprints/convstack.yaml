  # sign-up and reset work by mailing a link, so both are closed until a mail
  # host is set. Written as allow or deny from .env on every apply
  - model: authentik_policies_expression.expressionpolicy
    id: convstack-mail-configured
    identifiers:
      name: convstack-mail-configured
    attrs:
      expression: !If [!Env AUTHENTIK_EMAIL__HOST, "return True", "return False"]

  - model: authentik_policies_password.passwordpolicy
    id: convstack-password-policy
    identifiers:
      name: convstack-password-policy
    attrs:
      password_field: password
      length_min: 10
      check_static_rules: true
      check_zxcvbn: true
      # fails at this score or below, so a password needs 2 or more
      zxcvbn_score_threshold: 1
      error_message: Use at least 10 characters.

  - model: authentik_policies_expression.expressionpolicy
    id: convstack-enrollment-email
    identifiers:
      name: convstack-enrollment-email
    attrs:
      expression: |
        from authentik.core.models import User

        data = request.context["prompt_data"]
        email = data["email"].strip()
        holders = list(User.objects.filter(email__iexact=email) | User.objects.filter(username__iexact=email))
        for holder in holders:
            unconfirmed = (
                not holder.is_active
                and holder.last_login is None
                and holder.attributes.get("convstack_pending")
            )
            if not unconfirmed:
                ak_message("That email already has an account. Sign in or reset your password.")
                return False
        # an earlier sign-up nobody confirmed must not lock the address
        for holder in holders:
            holder.delete()
        data["email"] = email
        data["username"] = email
        return True

  - model: authentik_stages_prompt.prompt
